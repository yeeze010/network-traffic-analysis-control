name: Build Test And Docs Governance

on:
  pull_request:
  push:
    branches:
      - main
      - develop

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Test API and domain services
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Validate documentation baseline
        shell: pwsh
        run: .\scripts\validate-docs.ps1
